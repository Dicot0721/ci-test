name: OpenBSD Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        release: ["7.8", "8"]
        include:
          - set-policy-min: true
            cmd: export CMAKE_POLICY_VERSION_MINIMUM=3.5
          - set-policy-min: false
            cmd: ""

    steps:
      - uses: actions/checkout@v7

      - uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: pkg_add -Iv bash cmake coreutils curl git ninja zip unzip-6.0p18-iconv
          run: |
            ${{ matrix.cmd }}
            git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
            (cd "$HOME/vcpkg" && ./bootstrap-vcpkg.sh)
